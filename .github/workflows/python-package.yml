name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - python-version: '3.6'
            image: python:3.6.15-buster
          - python-version: '3.7'
            image: python:3.7.17-bookworm
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: ${{ !matrix.image }}
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test on the runner
        if: ${{ !matrix.image }}
        run: |
          python -m pip install 'tox>=4,<5'
          python -m tox -e "py${PYTHON_VERSION//./}"
      - name: Test in the legacy Python container
        if: matrix.image
        env:
          PYTHON_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --env "TOX_ENV=py${PYTHON_VERSION//./}" \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$PYTHON_IMAGE" sh -ec '
              python -m venv /tmp/tox-runner
              /tmp/tox-runner/bin/python -m pip install "tox==3.28.0"
              /tmp/tox-runner/bin/python -m tox -e "$TOX_ENV"
            '
      - name: Check types
        if: matrix.python-version == '3.14'
        run: python -m tox -e mypy
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: .tox/coverage/
          include-hidden-files: true
