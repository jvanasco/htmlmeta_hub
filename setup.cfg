[metadata]
name = htmlmeta_hub
version = attr: htmlmeta_hub.__VERSION__
description = Lightweight support for managing metadata on webpages.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/jvanasco/htmlmeta_hub
author = Jonathan Vanasco
author_email = jvanasco@2xlp.com
license = MIT
license_file = LICENSE.txt
keywords = metadata, html, web, pyramid
classifiers =
    Intended Audience :: Developers
    Framework :: Pyramid
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.6
zip_safe = False
include_package_data = True
install_requires =
    metadata_utils>=0.2.0
    setuptools<82; python_version >= "3.7" and python_version < "3.10"

[options.packages.find]
where = src

[options.package_data]
htmlmeta_hub = py.typed

[options.extras_require]
testing =
    mypy
    pyramid
    pytest

[tox:tox]
envlist = py36, py37, py38, py39, py310, py311, py312, py313, py314, py315, mypy
isolated_build = true

[testenv]
package = sdist
deps =
    coverage
    pyramid
    pytest
commands =
    python --version
    coverage run --source=htmlmeta_hub -m pytest {posargs}
    coverage report
    coverage html -d {toxworkdir}/coverage/{envname}
setenv =
    COVERAGE_FILE = {envtmpdir}/.coverage

[testenv:mypy]
basepython = python3.14
deps = mypy
commands = mypy src

[flake8]
application_import_names = htmlmeta_hub
import_order_style = appnexus
# E501 line too long
per-file-ignores:
    src/htmlmeta_hub/__init__.py: E501
    src/htmlmeta_hub/pyramid_helpers.py: E501
